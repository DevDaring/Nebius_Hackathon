name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codes/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nemotwins
          POSTGRES_PASSWORD: nemotwins
          POSTGRES_DB: nemotwins_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nemotwins -d nemotwins_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_MODE: demo
      DATABASE_URL: postgresql+psycopg://nemotwins:nemotwins@localhost:5432/nemotwins_test
      # tests/conftest.py reads this (and refuses to reset any non-test database)
      NEMOTWINS_TEST_DATABASE_URL: postgresql+psycopg://nemotwins:nemotwins@localhost:5432/nemotwins_test
      JWT_SECRET: ci-only-not-a-secret
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Codes/backend/requirements.lock
      - name: System libraries (LightGBM needs OpenMP)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
      - name: Install
        # Pinned versions (same as the hosted deployment), then the package itself without re-resolving.
        run: python -m pip install --upgrade pip && pip install -r requirements.lock && pip install -e ".[dev]" --no-deps
      - name: Ruff
        run: ruff check nemotwins $( [ -d tests ] && echo tests )
      - name: Mypy
        # Blocking: the whole nemotwins package (files = ["nemotwins"] in pyproject.toml).
        run: mypy
      - name: Pytest
        # Raw/processed research data are not in the repo; tests that need
        # data/processed skip themselves when it is absent. Exit code 5 = no tests collected.
        run: |
          set +e
          pytest
          code=$?
          if [ "$code" -eq 5 ]; then echo "No tests collected"; exit 0; fi
          exit $code
      - name: README exists and its results tables match reports/
        working-directory: Codes
        run: |
          test -f ../README.md
          python scripts/build_readme.py --check

  frontend:
    name: Frontend (eslint, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codes/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Codes/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan git history
        run: gitleaks git --config Codes/.gitleaks.toml --redact --verbose .

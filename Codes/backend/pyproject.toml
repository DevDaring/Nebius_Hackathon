[project]
name = "nemotwins"
version = "1.1.0"
description = "NemoTwins - multilingual glucose digital twin (research prototype) with an NVIDIA Nemotron agent on Nebius"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "shap>=0.45",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "matplotlib>=3.8",
  "python-pptx>=0.6.23",
  "nemoguardrails==0.24.1",
  "nebius==0.6.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.9", "fhir.resources>=7.1", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nemotwins*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning:lightgbm.*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["nemotwins"]
plugins = ["pydantic.mypy"]

# numpy / lightgbm stub false positives (dict-literal inference, **params into estimators,
# ndarray indexing overloads) in the modelling modules; real type errors stay enabled.
[[tool.mypy.overrides]]
module = ["nemotwins.twin.runner", "nemotwins.twin.filter"]
disable_error_code = ["arg-type", "call-overload", "dict-item", "misc"]
